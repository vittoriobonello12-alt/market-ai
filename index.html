<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market AI V5.1</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#edf4ff;font-family:-apple-system,BlinkMacSystemFont,system-ui;background:radial-gradient(circle at 85% 0%,#123b72 0,transparent 35%),linear-gradient(145deg,#020407,#06101f 55%,#071e40)}main{max-width:950px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{margin:0;font-size:31px}.muted{color:#8fa0b8;font-size:13px}.box{background:#07111fe8;border:1px solid #203755;border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 14px 40px #0005}.controls{display:flex;gap:9px}.controls input{flex:1;min-width:0;padding:13px;border-radius:13px;border:1px solid #29415f;background:#050c16;color:white;font-size:17px;text-transform:uppercase}.controls button{padding:13px 18px;border:0;border-radius:13px;background:#1764b3;color:white;font-weight:700}.quick{display:flex;gap:7px;overflow:auto;padding:11px 0}.quick button,.tabs button{padding:8px 11px;border-radius:999px;border:1px solid #29415f;background:#081524;color:#c8d7ea;white-space:nowrap}.tabs{display:flex;gap:7px}.tabs button{flex:1;border-radius:11px}.tabs .active{background:#123a68;border-color:#3973ad}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.big{font-size:38px;font-weight:800;margin:5px 0}.pill{display:inline-block;padding:8px 11px;border-radius:99px;background:#12345a;font-weight:700}.grid,.prob{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.prob>div{padding:13px;border-radius:14px;background:#091827;border:1px solid #182d46}.metric b,.num{display:block;font-size:21px;margin-top:4px}.num{font-size:29px}.factor{display:flex;align-items:center;gap:9px;margin:12px 0}.fname{width:125px;font-size:13px}.track{flex:1;height:8px;background:#15263c;border-radius:99px;overflow:hidden}.fill{height:100%;background:#397cc1}.fval{width:48px;text-align:right;font-size:12px;color:#9fb1c9}.impactline{display:flex;align-items:center;gap:12px;margin:10px 0 2px}.impactnum{font-size:24px;font-weight:800}.impactbar{flex:1;height:9px;background:#15263c;border-radius:99px;overflow:hidden}.impactfill{height:100%;background:#397cc1}.news{padding:10px 0;border-bottom:1px solid #172b42;font-size:14px;line-height:1.35}.news small{display:block;color:#70829b;margin-top:4px}@media(max-width:650px){.hero{grid-template-columns:1fr}}</style></head><body><main>
<div class="top"><div><h1>Market AI</h1><div class="muted">V5.1 · mercato + fattori esterni</div></div><div class="muted">LIVE DATA</div></div>
<div class="box"><div class="controls"><input id="ticker" value="NVDA"><button id="go">Analizza</button></div><div class="quick" id="quick"></div><div class="tabs"><button class="active" data-h="1">1 giorno</button><button data-h="3">3 giorni</button><button data-h="7">7 giorni</button></div><div id="status" class="muted" style="margin-top:10px">Inserisci un ticker e premi Analizza.</div></div>
<div id="app" style="display:none"><div class="box hero"><div><div class="muted" id="name"></div><div class="big" id="price"></div><div class="muted" id="date"></div></div><div><div class="muted">Indicazione modello</div><div class="pill" id="signal"></div></div></div>
<div class="box"><b>Probabilità stimate</b><div class="prob" style="margin-top:11px"><div><div class="muted">Rialzo</div><div class="num" id="up"></div></div><div><div class="muted">Ribasso</div><div class="num" id="down"></div></div></div></div>
<div class="box"><b>Fattori esterni e tecnici</b><div id="factors"></div><div class="muted">Punteggi da −100 a +100: non sono percentuali.</div></div>
<div class="box"><b>Impatto esterno complessivo</b><div class="impactline"><div class="impactnum" id="impactnum"></div><div class="impactbar"><div class="impactfill" id="impactfill"></div></div></div><div class="muted" id="impactnote"></div></div>
<div class="box"><b>News ed eventi</b><div id="news"></div></div>
<div class="box"><b>Indicatori tecnici</b><div class="grid" id="metrics" style="margin-top:11px"></div></div>
<div class="box"><b>Backtest rapido</b><div class="grid" id="backtest" style="margin-top:11px"></div></div></div></main>
<script>
const $=x=>document.getElementById(x),fmtPct=x=>(Number(x)*100).toFixed(1)+"%",usd=x=>Number(x).toLocaleString("en-US",{style:"currency",currency:"USD"});let horizon=1;
[["NVIDIA","NVDA"],["Apple","AAPL"],["Microsoft","MSFT"],["Amazon","AMZN"],["Alphabet","GOOGL"],["Tesla","TSLA"],["Meta","META"],["Broadcom","AVGO"]].forEach(x=>{let b=document.createElement("button");b.textContent=x[0];b.onclick=()=>{$("ticker").value=x[1];run()};$("quick").appendChild(b)});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");horizon=+b.dataset.h;run()});$("go").onclick=run;
async function run(){let t=$("ticker").value.trim().toUpperCase();if(!t)return;$("status").textContent="Analisi in corso…";try{let c=new AbortController();let timer=setTimeout(()=>c.abort(),30000);let r=await fetch(`/api/forecast/${encodeURIComponent(t)}?horizon=${horizon}`,{signal:c.signal});clearTimeout(timer);let d=await r.json();if(!r.ok)throw Error(d.detail);$("app").style.display="block";$("status").textContent="Analisi completata";$("name").textContent=d.ticker;$("price").textContent=usd(d.price);$("date").textContent="Dati al "+d.date;$("signal").textContent=d.signal;$("up").textContent=fmtPct(d.up);$("down").textContent=fmtPct(d.down);
$("metrics").innerHTML=[["SMA 20",usd(d.sma20)],["SMA 50",usd(d.sma50)],["SMA 200",usd(d.sma200)],["RSI 14",d.rsi14.toFixed(1)],["Volatilità 20g",fmtPct(d.vol20)],["Prezzo vs SMA50",fmtPct(d.price_vs_sma50)]].map(x=>`<div class="metric"><div class="muted">${x[0]}</div><b>${x[1]}</b></div>`).join("");
$("backtest").innerHTML=`<div class="metric"><div class="muted">Accuratezza test</div><b>${fmtPct(d.test_accuracy)}</b></div><div class="metric"><div class="muted">Orizzonte</div><b>${d.horizon_days} giorno/i</b></div>`;
$("factors").innerHTML=d.factors.map(f=>{let v=Math.max(-100,Math.min(100,f.value*100)),w=Math.abs(v);return `<div class="factor"><div class="fname">${f.name}</div><div class="track"><div class="fill" style="width:${w}%;margin-left:${v<0?100-w:0}%"></div></div><div class="fval">${v>=0?"+":""}${v.toFixed(0)}</div></div>`}).join("");
let impact=Math.round(d.external_impact*100);$("impactnum").textContent=impact+"/100";$("impactfill").style.width=impact+"%";$("impactnote").textContent=impact<25?"Impatto basso: le notizie rilevate non indicano eventi esterni particolarmente rilevanti.":impact<50?"Impatto moderato: presenti alcuni eventi o notizie con possibile rilevanza.":impact<75?"Impatto alto: sono presenti più segnali o un evento rilevante.":"Impatto molto alto: il sistema rileva segnali esterni eccezionali o fortemente corroborati.";
let n=d.news;$("news").innerHTML=n.available?`<div class="muted" style="margin:9px 0">Sentiment: ${n.label} · ${n.articles.length} notizie analizzate</div>`+n.articles.map(a=>`<div class="news">${a.title}<small>${a.source} · ${a.published}</small></div>`).join(""):"News non disponibili in questo momento.";
}catch(e){$("status").textContent=e.name==="AbortError"?"Tempo scaduto: il server sta impiegando troppo tempo.":e.message||"Errore del server."}}
</script></body></html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market AI V6</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef3ff;background:radial-gradient(circle at top,#102a52 0,#05070d 48%,#020308 100%);min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:28px 16px 50px}.hero{text-align:center;padding:25px 0}.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:#aab8d4;margin:0}
.search{display:flex;gap:8px;max-width:720px;margin:25px auto 12px}.search input{flex:1;background:#0d1423;border:1px solid #263753;border-radius:14px;padding:15px;color:white;font-size:17px}.search button,.quick button{border:0;border-radius:12px;padding:12px 15px;background:#173b70;color:white;font-weight:700}
.quick{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}.quick button{background:#0d1729;border:1px solid #263753;font-weight:600}
.tabs{display:flex;justify-content:center;gap:8px;margin:15px}.tabs button{padding:9px 18px;border-radius:20px;border:1px solid #2a3d5c;background:#0b1220;color:#cbd7eb}.tabs .on{background:#1c4c8f;color:white}
.card{background:rgba(8,14,26,.84);border:1px solid #213452;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 15px 40px #0005}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{font-size:30px;font-weight:800}.muted{color:#91a0bb;font-size:13px}.bar{height:9px;background:#162238;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#377bd9,#71b7ff);border-radius:10px}.news{border-top:1px solid #1e2d45;padding:14px 0}.tag{display:inline-block;padding:4px 8px;border-radius:8px;background:#14233b;font-size:11px;margin-right:5px}.score{font-weight:800}.reason{color:#aebbd0;font-size:13px;margin-top:7px}.warn{color:#f2c777}.center{text-align:center}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.search{flex-direction:column}}

.chartbox{height:310px;overflow-x:auto;overflow-y:hidden;border:1px solid #1e2e49;border-radius:14px;padding:10px;background:#050b15}
.chartbox canvas{min-width:820px;width:100%;height:285px}
.chart-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chart-controls button{padding:8px 12px;border-radius:10px;border:1px solid #2a3d5c;background:#0b1220;color:#cbd7eb}.chart-controls button.on{background:#173b70;color:#fff}
.section-title{font-size:26px;margin:30px 0 8px}.section-sub{color:#91a0bb;margin:0 0 15px}

</head>
<body><div class="wrap">
<div class="hero"><h1>Market AI V6</h1><p>Analisi tecnica + analisi approfondita delle notizie + macro/geopolitica</p></div>
<div class="search"><input id="ticker" value="KO" placeholder="Ticker, es. KO, AAPL, NVDA"><button onclick="run()">ANALIZZA</button></div>
<div class="quick" id="quick"></div>
<div class="tabs">
<button onclick="setH(1)" id="h1">1G</button><button onclick="setH(3)" id="h3" class="on">3G</button>
<button onclick="setH(7)" id="h7">7G</button><button onclick="setH(14)" id="h14">14G</button>
<button onclick="setH(30)" id="h30">30G</button><button onclick="setH(60)" id="h60">60G</button>
<button onclick="setH(90)" id="h90">90G</button></div>
<div id="out" class="card center">Inserisci un titolo e avvia l'analisi.</div>
</div>
<script>
let H=3;
const qs=["NVDA","AAPL","MSFT","AMZN","GOOGL","TSLA","META","AVGO","KO","PG","PEP","MCD"];
document.getElementById("quick").innerHTML=qs.map(x=>`<button onclick="ticker.value='${x}';run()">${x}</button>`).join("");
function setH(x){H=x;document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));document.getElementById("h"+x).classList.add("on")}
function pct(x){return Math.round(x*100)}
async function run(){
 const t=document.getElementById("ticker").value.trim().toUpperCase(); if(!t)return;
 const o=document.getElementById("out");o.innerHTML="<div>Analisi in corso…</div>";
 try{
  const r=await fetch(`/analyze?ticker=${encodeURIComponent(t)}&horizon=${H}`);
  const d=await r.json(); if(!r.ok)throw Error(d.detail||"Errore");
  o.className="card";
  let news=d.news.map(n=>`<div class="news"><div><span class="tag">${n.direction}</span><span class="tag">Rilevanza ${n.relevance}/100</span><span class="tag">Impatto ${n.impact}/100</span></div><div style="margin-top:7px;font-weight:700">${n.title}</div><div class="muted">${n.source||""}</div><div class="reason">${n.reason}</div></div>`).join("");
  o.innerHTML=`<div class="grid">
  <div><div class="muted">Probabilità modello rialzo</div><div class="metric">${pct(d.prob_up)}%</div></div>
  <div><div class="muted">Segnale</div><div class="metric">${d.signal}</div></div>
  <div><div class="muted">Influenza esterna</div><div class="metric">${d.external_impact}/100</div><div class="muted">${d.external_label}</div></div>
  </div>
  <div class="card"><b>Influenza esterna</b><div class="bar"><div class="fill" style="width:${d.external_impact}%"></div></div><p class="muted">Indice separato dalla probabilità: misura quanto le notizie esterne risultano rilevanti e potenzialmente influenti per questo titolo.</p></div>
  <div class="grid"><div><div class="muted">Fattore tecnico</div><div class="metric">${d.technical_factor>0?"+":""}${d.technical_factor}</div></div><div><div class="muted">News</div><div class="metric">${d.news_factor>0?"+":""}${d.news_factor}</div></div><div><div class="muted">Macro/geopolitica</div><div class="metric">${d.macro_factor>0?"+":""}${d.macro_factor}</div></div></div>
  <div class="card"><b>Notizie analizzate singolarmente</b>${news||"<p class='muted'>Nessuna notizia disponibile.</p>"}</div>
  <p class="warn">${d.note}</p>`;
 }catch(e){o.innerHTML=`<b>Errore</b><p class="muted">${e.message}</p>`}
}
</script></body></html>
